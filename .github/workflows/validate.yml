name: Validate catalog

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate JSON and catalog
        run: |
          python -m json.tool data/catalog.json >/dev/null
          python -m json.tool data/catalog.schema.json >/dev/null
          python -m json.tool data/source-audit.json >/dev/null
          python scripts/validate_catalog.py
          python -m unittest discover -s tests
      - name: Check generated full catalog
        run: |
          python scripts/build_catalog_docs.py
          git diff --exit-code -- docs/catalog.md
      - name: Check generated localized READMEs
        run: |
          python scripts/build_localized_readmes.py
          git diff --exit-code -- README.zh-CN.md README.ja.md README.ko.md
      - name: Check generated Pages output
        run: |
          python scripts/build_site.py
          git diff --exit-code -- site
      - name: Lint the human-facing README
        run: npx --yes awesome-lint README.md
      - name: Check whitespace
        run: git diff --check
